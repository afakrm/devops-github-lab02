name: Guide checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check decision labels
        run: |
          for label in APPROVE VERIFY DECLINE; do
            grep -q "^- ${label}:" decisions.md || exit 1
          done